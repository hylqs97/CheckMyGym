<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>健身房人数监控</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: dark;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        font-family: 'Outfit', 'Segoe UI', system-ui, -apple-system, sans-serif;
        background: radial-gradient(circle at top, rgba(110, 139, 255, 0.25), transparent 40%),
          radial-gradient(circle at 20% 20%, rgba(159, 122, 234, 0.18), transparent 35%),
          #050816;
        min-height: 100vh;
      }

      #root {
        position: relative;
      }

      .bg-overlay {
        position: fixed;
        inset: 0;
        background: linear-gradient(135deg, rgba(110, 139, 255, 0.18), rgba(102, 212, 131, 0.1));
        pointer-events: none;
        mix-blend-mode: screen;
        z-index: 0;
      }

      .content-shell {
        position: relative;
        z-index: 1;
      }
    </style>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script crossorigin src="https://unpkg.com/@emotion/react@11.11.4/dist/emotion-react.umd.min.js"></script>
    <script crossorigin src="https://unpkg.com/@emotion/styled@11.11.5/dist/emotion-styled.umd.min.js"></script>
    <script crossorigin src="https://unpkg.com/@mui/material@5.15.20/umd/material-ui.development.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons&display=swap" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  </head>
  <body>
    {% raw %}
    <div class="bg-overlay"></div>
    <div id="root" class="content-shell"></div>
    <script type="text/babel" data-presets="env,react" src="{{ url_for('static', filename='js/app.jsx') }}"></script>
    {% endraw %}
  </body>
</html>
